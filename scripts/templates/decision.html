<!DOCTYPE html>
<html lang="en" data-room="server">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{url}}">
  <link rel="alternate" hreflang="en" href="{{url}}?lang=en">
  <link rel="alternate" hreflang="et" href="{{url}}?lang=et">
  <link rel="alternate" hreflang="x-default" href="{{url}}">
  <link rel="icon" href="/logo.svg" type="image/svg+xml" sizes="any">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d0d" media="(prefers-color-scheme: dark)">
  <!-- site-theme -->
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{url}}">
  <meta property="og:site_name" content="Kaido Henrik Elias">
  <meta property="og:title" content="{{pageTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="https://khe.ee/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{pageTitle}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="https://khe.ee/og-image.png">
  <link rel="preload" href="/assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/source-serif-4-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="/assets/site-locale.js">
  <link rel="modulepreload" href="/assets/theme.js">
  <link rel="stylesheet" href="/assets/site-header.css">
  <link rel="stylesheet" href="/assets/site.css">
  <script defer src="/assets/analytics-consent.js" data-analytics-token="58734ed4ae1e4b4e8a8f8f7d50ff74f2" data-analytics-privacy-url="/privacy?lang=en"></script>
  <script type="application/ld+json">{{jsonLd}}</script>
</head>
<body class="architecture-page architecture-decision" data-page="decision">

<!-- site-header home=landing rooms theme -->

<main class="arch arch-decision">
  <p class="arch-breadcrumb"><a href="/architecture/decisions/?lang=en" data-link="register">&larr; <span data-i18n="backToRegister"></span></a></p>
  <p class="arch-kicker" data-i18n="decisionKicker"></p>
  <h1 lang="en">ADR-{{id}}: {{title}}</h1>
  <dl class="arch-meta">
{{meta}}
  </dl>
{{notice}}
  <p class="arch-lang-note" data-i18n="decisionsInEnglish"></p>
  <article class="arch-adr" lang="en">
{{body}}
  </article>
  <p class="arch-source"><a href="{{sourceUrl}}" data-i18n="sourceOnGithub"></a></p>
</main>

<!-- site-footer -->

<script type="module" src="/architecture/architecture.js"></script>
</body>
</html>
