<!-- site-header home=landing title=headerHomeAutomation fixed -->
<script type="module">
  import { createLocaleController } from '/assets/site-locale.js';

  const header = document.querySelector('.site-header');
  // The demo's bars and views are position: fixed and start below --host-h.
  new ResizeObserver(() => {
    document.documentElement.style.setProperty('--host-h', `${header.getBoundingClientRect().height}px`);
  }).observe(header);
  // The demo itself is Estonian only: its title and description stay khe-home-assistant's,
  // and its content keeps lang="et" when the header switches the page to English.
  const description = document.querySelector('meta[name="description"]');
  for (const node of document.body.children) {
    if (node !== header && !node.lang) node.lang = 'et';
  }

  const COPY = {
    et: {
      title: document.title,
      description: description ? description.content : '',
    },
    en: {
      title: 'Home · Home Assistant demo',
      description: 'A made-up house on a Home Assistant dashboard: a 3D view and simulated devices.',
    },
  };

  createLocaleController({
    copy: COPY,
    defaultLocale: 'en',
    links: { home: (locale) => `/?lang=${locale}` },
  });

</script>
