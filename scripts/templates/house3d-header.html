<!-- site-header home=landing rooms fixed -->
<script type="module">
  import { createLocaleController } from '/assets/site-locale.js';

  const header = document.querySelector('.site-header');
  // The demo's bars and views are position: fixed and start below --host-h.
  new ResizeObserver(() => {
    document.documentElement.style.setProperty('--host-h', `${header.getBoundingClientRect().height}px`);
  }).observe(header);
  const description = document.querySelector('meta[name="description"]');

  const COPY = {
    et: {
      title: document.title,
      description: description ? description.content : '',
    },
    en: {
      title: 'Home · Home Assistant demo',
      description: 'A made-up house on a Home Assistant dashboard: a 3D view and simulated devices.',
    },
  };

  createLocaleController({
    copy: COPY,
    defaultLocale: 'en',
    links: { home: (locale) => `/?lang=${locale}` },
  });

  // The demo takes its language from ?lang once, when it loads (khe-home-assistant ADR-003), so
  // switching reloads the page. The controller has already written ?lang and the stored choice;
  // the hash keeps the open view.
  const loaded = document.documentElement.lang;
  document.querySelectorAll('[data-lang-option]').forEach((button) => {
    button.addEventListener('click', () => {
      if (button.getAttribute('data-lang-option') !== loaded) window.location.reload();
    });
  });

</script>
