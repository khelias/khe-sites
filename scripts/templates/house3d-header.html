<script>
  // In the /ha/ page's window the page around it has the header, the demo line and the consent banner.
  if (window.top !== window) {
    document.documentElement.setAttribute('data-embedded', '');
  } else {
    const consent = document.createElement('script');
    consent.src = '/assets/analytics-consent.js';
    consent.setAttribute('data-analytics-token', '58734ed4ae1e4b4e8a8f8f7d50ff74f2');
    consent.setAttribute('data-analytics-privacy-url', '/privacy?lang=en');
    document.head.append(consent);
  }
</script>
<style>html[data-embedded] .site-header { display: none; }</style>
<!-- site-header home=landing rooms fixed demo -->
<script type="module">
  import { createLocaleController } from '/assets/site-locale.js';

  // In the /ha/ page's window a link that leaves the demo opens in the whole tab.
  if (document.documentElement.hasAttribute('data-embedded')) {
    document.addEventListener('click', (event) => {
      const link = event.target instanceof Element && event.target.closest('a[href]');
      if (link && !link.target && (link.origin !== window.location.origin || link.pathname !== window.location.pathname)) link.target = '_top';
    });
  }

  const header = document.querySelector('.site-header');
  // The demo's bars and views are position: fixed and start below --host-h.
  new ResizeObserver(() => {
    document.documentElement.style.setProperty('--host-h', `${header.getBoundingClientRect().height}px`);
  }).observe(header);
  const description = document.querySelector('meta[name="description"]');

  const COPY = {
    et: {
      title: document.title,
      description: description ? description.content : '',
    },
    en: {
      title: 'Home · Home Assistant demo',
      description: 'A made-up house on a Home Assistant dashboard: a 3D view and simulated devices.',
    },
  };

  createLocaleController({
    copy: COPY,
  });

  // The demo takes its language from ?lang once, when it loads (khe-home-assistant ADR-003), so
  // switching reloads the page. The controller has already written ?lang and the stored choice;
  // the hash keeps the open view.
  const loaded = document.documentElement.lang;
  document.querySelectorAll('[data-lang-option]').forEach((button) => {
    button.addEventListener('click', () => {
      if (button.getAttribute('data-lang-option') !== loaded) window.location.reload();
    });
  });

</script>
