<svg class="plate" viewBox="0 0 640 400" aria-hidden="true" focusable="false">
  <rect width="640" height="400" class="plate-bg"/>
  <defs><marker id="plate-server-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" class="plate-arrow"/></marker></defs>

  <rect x="28" y="150" width="112" height="80" rx="8" class="plate-box"/>
  <text x="44" y="184" class="plate-ink plate-t16" data-i18n="plateUser"></text>
  <text x="44" y="206" class="plate-muted plate-t13" data-i18n="plateUserSub"></text>

  <line x1="140" y1="190" x2="168" y2="190" class="plate-line" marker-end="url(#plate-server-arrow)"/>

  <rect x="168" y="122" width="142" height="136" rx="8" class="plate-box-dashed"/>
  <text x="184" y="160" class="plate-ink plate-t16">Cloudflare</text>
  <text x="184" y="186" class="plate-muted plate-t13">DNS, TLS</text>
  <text x="184" y="208" class="plate-muted plate-t13" data-i18n="plateEdgeSignIn"></text>
  <text x="184" y="230" class="plate-muted plate-t13" data-i18n="plateEdgeCopy"></text>

  <line x1="310" y1="190" x2="358" y2="190" class="plate-accent-line" marker-end="url(#plate-server-arrow)"/>
  <text x="334" y="178" text-anchor="middle" class="plate-accent plate-mono plate-t11" data-i18n="plateTunnel"></text>

  <rect x="360" y="36" width="252" height="306" rx="10" class="plate-host"/>
  <text x="378" y="66" class="plate-accent plate-t14 plate-strong" data-i18n="plateHost"></text>
  <text x="596" y="66" text-anchor="end" class="plate-muted plate-mono plate-t11">Proxmox VE</text>

  <rect x="376" y="84" width="220" height="132" rx="6" class="plate-box"/>
  <text x="392" y="116" class="plate-ink plate-t16">Docker VM</text>
  <text x="392" y="142" class="plate-muted plate-t13" data-i18n="plateDockerSub"></text>
  <text x="392" y="164" class="plate-muted plate-t13">Home Assistant</text>
  <text x="392" y="186" class="plate-muted plate-t13" data-i18n="plateDockerSub2"></text>

  <rect x="376" y="228" width="220" height="98" rx="6" class="plate-box"/>
  <text x="392" y="260" class="plate-ink plate-t16" data-i18n="plateAgentVm"></text>
  <text x="392" y="286" class="plate-muted plate-t13" data-i18n="plateAgentVmSub"></text>

  <line x1="28" y1="360" x2="612" y2="360" class="plate-rule"/>
  <text x="28" y="384" class="plate-ink plate-mono plate-t12" data-i18n="plateNoPorts"></text>
</svg>
