<!DOCTYPE html>
<html lang="et" data-room="server">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- page-meta -->
  <link rel="icon" href="/logo.svg" type="image/svg+xml" sizes="any">
  <meta name="theme-color" content="#f6f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0e0f" media="(prefers-color-scheme: dark)">
  <!-- site-theme -->
  <link rel="preload" href="/assets/fonts/familjen-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="/assets/site-locale.js">
  <link rel="modulepreload" href="/assets/theme.js">
  <link rel="stylesheet" href="/assets/site-header.css">
  <link rel="stylesheet" href="/assets/site.css">
  <script defer src="/assets/analytics-consent.js" data-analytics-token="58734ed4ae1e4b4e8a8f8f7d50ff74f2" data-analytics-privacy-url="/privacy/"></script>
</head>
<body class="architecture-page" data-page="architecture">

<!-- site-header home=landing rooms theme -->

<main class="arch">
  <header class="arch-hero">
    <div class="arch-hero__text">
      <p class="arch-kicker" data-i18n="kicker"></p>
      <h1 id="arch-title" data-i18n="headline"></h1>
      <p class="arch-lead" data-i18n="lead"></p>
      <p class="arch-lead" data-i18n-html="leadHow"></p>
    </div>
  </header>

  <nav class="arch-nav" aria-label="On this page" data-i18n-aria="tocLabel">
    <ol>
      <li><a href="#estate"><span data-i18n="navEstate"></span></a></li>
      <li><a href="#shipping"><span data-i18n="navShipping"></span></a></li>
      <li><a href="#uptime"><span data-i18n="navUptime"></span></a></li>
    </ol>
  </nav>

  <section class="arch-section" id="estate" aria-labelledby="estate-title">
    <h2 id="estate-title" data-i18n="estateTitle"></h2>
    <p class="arch-prose" data-i18n="estateIntro"></p>
    <!-- view:estate -->
    <details class="arch-details">
      <summary data-i18n="blocksSummary"></summary>
      <!-- blocks -->
    </details>
  </section>

  <section class="arch-section" id="shipping" aria-labelledby="shipping-title">
    <h2 id="shipping-title" data-i18n="shippingTitle"></h2>
    <p class="arch-prose" data-i18n="shippingIntro"></p>
    <!-- view:shipping -->
    <p class="arch-note" data-i18n="shippingNote"></p>
    <p class="arch-prose arch-crosslink" data-i18n-html="shippingBefore"></p>
  </section>

  <section class="arch-section" id="uptime" aria-labelledby="uptime-title">
    <h2 id="uptime-title" data-i18n="uptimeTitle"></h2>
    <div class="arch-columns">
      <div>
        <h3 class="arch-tag arch-tag--buys" data-i18n="layersLabel"></h3>
        <ol class="arch-layers">
          <li><span class="arch-tag">1</span><span><strong data-i18n="layer1Title"></strong><span data-i18n="layer1Desc"></span></span><span class="arch-tag" data-i18n="layer1Time"></span></li>
          <li><span class="arch-tag">2</span><span><strong data-i18n="layer2Title"></strong><span data-i18n="layer2Desc"></span></span><span class="arch-tag" data-i18n="layer2Time"></span></li>
          <li><span class="arch-tag">3</span><span><strong data-i18n="layer3Title"></strong><span data-i18n="layer3Desc"></span></span><span class="arch-tag" data-i18n="layer3Time"></span></li>
          <li><span class="arch-tag">4</span><span><strong data-i18n="layer4Title"></strong><span data-i18n="layer4Desc"></span></span><span class="arch-tag" data-i18n="layer4Time"></span></li>
          <li><span class="arch-tag">5</span><span><strong data-i18n="layer5Title"></strong><span data-i18n="layer5Desc"></span></span><span class="arch-tag" data-i18n="layer5Time"></span></li>
          <li><span class="arch-tag">6</span><span><strong data-i18n="layer6Title"></strong><span data-i18n="layer6Desc"></span></span><span class="arch-tag" data-i18n="layer6Time"></span></li>
        </ol>
        <p class="arch-note" data-i18n="backupLine"></p>
      </div>
      <div>
        <h3 class="arch-tag arch-tag--costs" data-i18n="weakLabel"></h3>
        <ul class="arch-list">
          <li><strong data-i18n="weak1Title"></strong> <span data-i18n="weak1Body"></span></li>
          <li><strong data-i18n="weak2Title"></strong> <span data-i18n="weak2Body"></span></li>
          <li><strong data-i18n="weak3Title"></strong> <span data-i18n="weak3Body"></span></li>
        </ul>
        <h3 class="arch-tag" data-i18n="nextLabel"></h3>
        <ul class="arch-next">
          <li data-i18n="next2"></li>
          <li data-i18n-html="next3"></li>
          <li data-i18n="next4"></li>
        </ul>
      </div>
    </div>
  </section>

  <p class="arch-prose arch-onward" data-i18n-html="onwardDecisions"></p>
</main>

<!-- site-footer -->

<script type="module" src="/architecture/architecture.js"></script>
</body>
</html>
