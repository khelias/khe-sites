<!DOCTYPE html>
<html lang="et" data-room="home">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- page-meta -->
  <link rel="icon" href="/logo.svg" type="image/svg+xml" sizes="any">
  <meta name="theme-color" content="#f6f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0e0f" media="(prefers-color-scheme: dark)">
  <!-- site-theme -->
  <link rel="preload" href="/assets/fonts/familjen-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="/assets/site-locale.js">
  <link rel="modulepreload" href="/assets/theme.js">
  <link rel="stylesheet" href="/assets/site-header.css">
  <link rel="stylesheet" href="/assets/site.css">
  <script defer src="/assets/analytics-consent.js" data-analytics-token="58734ed4ae1e4b4e8a8f8f7d50ff74f2" data-analytics-privacy-url="/privacy/"></script>
</head>
<body class="architecture-page" data-page="agents">

<!-- site-header home=landing rooms theme -->

<main class="arch">
  <header class="arch-hero">
    <div class="arch-hero__text">
      <p class="arch-kicker" data-i18n="agentsKicker"></p>
      <h1 id="arch-title" data-i18n="agentsHeadline"></h1>
      <p class="arch-lead" data-i18n="agentsLead"></p>
    </div>
  </header>

  <section class="arch-section arch-path" id="path" aria-labelledby="path-title">
    <div class="arch-path__intro">
      <h2 id="path-title" data-i18n="agentsPathTitle"></h2>
      <p class="visually-hidden" data-i18n="agentsLegend"></p>
      <ul class="arch-legend">
        <li class="arch-step--me"><span class="arch-step__mark" aria-hidden="true"></span><span data-i18n="whoMe"></span></li>
        <li class="arch-step--separate"><span class="arch-step__mark" aria-hidden="true"></span><span data-i18n="whoSeparate"></span></li>
        <li class="arch-step--agent"><span class="arch-step__mark" aria-hidden="true"></span><span data-i18n="whoAgent"></span></li>
        <li class="arch-step--script"><span class="arch-step__mark" aria-hidden="true"></span><span data-i18n="whoScript"></span></li>
      </ul>
    </div>
    <ol class="arch-timeline">
      <li class="arch-step arch-step--me">
        <span class="arch-step__mark" aria-hidden="true"></span>
        <div>
          <p class="arch-step__head"><span class="arch-step__title" data-i18n="step01Title"></span> <span class="arch-step__who">01 · <span data-i18n="whoMe"></span></span></p>
          <p class="arch-step__body" data-i18n-html="step01Body"></p>
        </div>
      </li>
      <li class="arch-step arch-step--agent">
        <span class="arch-step__mark" aria-hidden="true"></span>
        <div>
          <p class="arch-step__head"><span class="arch-step__title" data-i18n="step02Title"></span> <span class="arch-step__who">02 · <span data-i18n="whoAgent"></span></span></p>
          <p class="arch-step__body" data-i18n-html="step02Body"></p>
        </div>
      </li>
      <li class="arch-step arch-step--separate">
        <span class="arch-step__mark" aria-hidden="true"></span>
        <div>
          <p class="arch-step__head"><span class="arch-step__title" data-i18n="step03Title"></span> <span class="arch-step__who">03 · <span data-i18n="whoSeparate"></span></span></p>
          <p class="arch-step__body" data-i18n-html="step03Body"></p>
        </div>
      </li>
      <li class="arch-step arch-step--me">
        <span class="arch-step__mark" aria-hidden="true"></span>
        <div>
          <p class="arch-step__head"><span class="arch-step__title" data-i18n="step04Title"></span> <span class="arch-step__who">04 · <span data-i18n="whoMe"></span></span></p>
          <p class="arch-step__body" data-i18n-html="step04Body"></p>
        </div>
      </li>
      <li class="arch-step arch-step--agent">
        <span class="arch-step__mark" aria-hidden="true"></span>
        <div>
          <p class="arch-step__head"><span class="arch-step__title" data-i18n="step05Title"></span> <span class="arch-step__who">05 · <span data-i18n="whoAgent"></span></span></p>
          <p class="arch-step__body" data-i18n-html="step05Body"></p>
        </div>
      </li>
      <li class="arch-step arch-step--separate">
        <span class="arch-step__mark" aria-hidden="true"></span>
        <div>
          <p class="arch-step__head"><span class="arch-step__title" data-i18n="step06Title"></span> <span class="arch-step__who">06 · <span data-i18n="whoSeparate"></span></span></p>
          <p class="arch-step__body" data-i18n-html="step06Body"></p>
        </div>
      </li>
      <li class="arch-step arch-step--agent">
        <span class="arch-step__mark" aria-hidden="true"></span>
        <div>
          <p class="arch-step__head"><span class="arch-step__title" data-i18n="step07Title"></span> <span class="arch-step__who">07 · <span data-i18n="whoAgent"></span></span></p>
          <p class="arch-step__body" data-i18n-html="step07Body"></p>
        </div>
      </li>
      <li class="arch-step arch-step--script">
        <span class="arch-step__mark" aria-hidden="true"></span>
        <div>
          <p class="arch-step__head"><span class="arch-step__title" data-i18n="step08Title"></span> <span class="arch-step__who">08 · <span data-i18n="whoScript"></span></span></p>
          <p class="arch-step__body" data-i18n-html="step08Body"></p>
        </div>
      </li>
      <li class="arch-step arch-step--agent">
        <span class="arch-step__mark" aria-hidden="true"></span>
        <div>
          <p class="arch-step__head"><span class="arch-step__title" data-i18n="step09Title"></span> <span class="arch-step__who">09 · <span data-i18n="whoAgent"></span></span></p>
          <p class="arch-step__body" data-i18n-html="step09Body"></p>
        </div>
      </li>
      <li class="arch-step arch-step--agent">
        <span class="arch-step__mark" aria-hidden="true"></span>
        <div>
          <p class="arch-step__head"><span class="arch-step__title" data-i18n="step10Title"></span> <span class="arch-step__who">10 · <span data-i18n="whoAgent"></span></span></p>
          <p class="arch-step__body" data-i18n-html="step10Body"></p>
        </div>
      </li>
    </ol>
  </section>

  <section class="arch-section arch-numbers" id="numbers" aria-labelledby="numbers-title">
    <h2 id="numbers-title"><span data-i18n="agentsNumbersTitle"></span>, <span class="arch-period" data-metric="period"></span></h2>
    <ul class="arch-totals">
      <li><span class="arch-total__value" data-metric="plans"></span><span data-i18n="agentsTotalPlans"></span></li>
      <li><span class="arch-total__value" data-metric="median"></span><span data-i18n="agentsTotalMedian"></span></li>
      <li><span class="arch-total__value" data-metric="reverted"></span><span data-i18n="agentsTotalReverted"></span></li>
      <li><span class="arch-total__value" data-metric="looked"></span><span data-i18n="agentsTotalLooked"></span></li>
    </ul>
    <h3 data-i18n="agentsFoundTitle"></h3>
    <!-- agents-findings -->
    <p class="arch-found-legend"><span class="arch-found-legend__item"><span class="arch-bar__acted" aria-hidden="true"></span><span data-i18n="agentsActed"></span></span><span class="arch-found-legend__item"><span class="arch-bar__dropped" aria-hidden="true"></span><span data-i18n="agentsDropped"></span></span><span data-i18n="agentsSource"></span></p>
  </section>

  <div class="arch-section arch-pair">
    <section id="where" aria-labelledby="where-title">
      <h2 id="where-title" data-i18n="agentsRunTitle"></h2>
      <p class="arch-prose" data-i18n-html="agentsRunSteered"></p>
      <p class="arch-prose" data-i18n-html="agentsRunAway"></p>
    </section>
    <section id="weak" aria-labelledby="weak-title">
      <h2 id="weak-title" data-i18n="agentsWeakTitle"></h2>
      <p class="arch-prose" data-i18n-html="agentsWeak1"></p>
      <p class="arch-prose" data-i18n-html="agentsWeak2"></p>
      <p class="arch-prose" data-i18n-html="agentsWeak3"></p>
    </section>
  </div>

  <p class="arch-prose arch-onward" data-i18n-html="agentsDecisions"></p>
</main>

<!-- site-footer -->

<script type="module" src="/architecture/architecture.js"></script>
</body>
</html>
