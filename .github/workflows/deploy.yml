name: Deploy to Homelab

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, homelab]
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # The homelab checkout the runner deploys from; keeps the Lab Atlas
          # snapshot in step with the stacks instead of the committed copy.
          HOMELAB_ROOT: /home/khe/homelab

      - name: Deploy landing
        run: |
          test -f dist/landing/index.html
          mkdir -p /srv/data/sites/khe
          rm -rf /srv/data/sites/khe/*
          cp -r dist/landing/* /srv/data/sites/khe/

      - name: Deploy games launcher
        run: |
          test -f dist/games/index.html
          mkdir -p /srv/data/games/launcher
          rm -rf /srv/data/games/launcher/*
          cp -r dist/games/* /srv/data/games/launcher/

      - name: Restart static nginx containers
        run: |
          cd /home/khe/homelab/services/apps/landing
          docker compose up -d landing
          cd /home/khe/homelab/services/apps/games
          docker compose up -d games
