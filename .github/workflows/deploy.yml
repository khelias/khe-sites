name: Deploy to Homelab

on:
  push:
    branches: [main]
  # A new ADR or a homelab change reaches the page within a week without a
  # push. GitHub disables schedules after 60 days without repo activity;
  # workflow_dispatch publishes at once either way.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, homelab]
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ARCHITECTURE_ROOT: ${{ github.workspace }}/.sources/khe-architecture
      # The homelab checkout the runner deploys from, so the architecture page
      # counts the stacks that actually run. Job level, since Check builds too.
      HOMELAB_ROOT: /home/khe/homelab

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # After the main checkout, whose clean would remove it.
      - name: Checkout khe-architecture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: khelias/khe-architecture
          path: .sources/khe-architecture
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          # ~/.npm already persists on this runner; the Actions cache would
          # re-download ~550 MB over the home line on every deploy.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Deploy landing
        run: |
          test -f dist/landing/index.html
          mkdir -p /srv/data/sites/khe
          rm -rf /srv/data/sites/khe/*
          cp -r dist/landing/* /srv/data/sites/khe/

      - name: Deploy games launcher
        run: |
          test -f dist/games/index.html
          mkdir -p /srv/data/games/launcher
          rm -rf /srv/data/games/launcher/*
          cp -r dist/games/* /srv/data/games/launcher/

      - name: Restart static nginx containers
        run: |
          cd /home/khe/homelab/services/apps/landing
          docker compose up -d landing
          cd /home/khe/homelab/services/apps/games
          docker compose up -d games
