name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static site quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The architecture page reads the ADRs and the estate index from
      # khe-architecture and the service groups from khe-homelab.
      ARCHITECTURE_ROOT: ${{ github.workspace }}/.sources/khe-architecture
      HOMELAB_ROOT: ${{ github.workspace }}/.sources/khe-homelab
      # /ha/ is built by khe-home-assistant's own script from its test house.
      HOME_ASSISTANT_ROOT: ${{ github.workspace }}/.sources/khe-home-assistant

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # After the main checkout, whose clean would remove them.
      - name: Checkout khe-architecture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: khelias/khe-architecture
          path: .sources/khe-architecture
          persist-credentials: false

      - name: Checkout khe-homelab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: khelias/khe-homelab
          path: .sources/khe-homelab
          persist-credentials: false

      # The 3D house demo at /ha/, built by its own script from the test house.
      - name: Checkout khe-home-assistant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: khelias/khe-home-assistant
          path: .sources/khe-home-assistant
          persist-credentials: false

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

  # Required on pull requests (estate ADR-020): the commits on the branch are
  # scanned with the same rules the local commit gate uses, from khe-workspace
  # at a pinned commit. Move the pin when those rules or the script change.
  pii-scan:
    name: Personal-data scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout khe-workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: khelias/khe-workspace
          ref: e975e7aeb0d11ac4a818fc9c4eb10b91df52c105
          path: .sources/khe-workspace
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the branch's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .sources/khe-workspace/scripts/pii-scan-range.sh "$BASE_SHA" "$HEAD_SHA"
